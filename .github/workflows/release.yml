name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            spark_arch: arm64
            target: Apple Silicon (arm64)
            dmg: Skillet-macOS-arm64.dmg
          - arch: x86
            spark_arch: x64
            target: Intel (x64)
            dmg: Skillet-macOS-x64.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install

      - name: Restore enriched-markdown native assets
        run: |
          SCRIPT="$(node -e "console.log(require.resolve('react-native-enriched-markdown/postinstall.mjs', { paths: ['.'] }))")"
          INIT_CWD="$PWD" node "$SCRIPT"

      - name: Run verification (typecheck, tests, and spark doctor)
        run: |
          bun run typecheck
          bun run test
          bun run doctor

      - name: Build and Stage macOS App (${{ matrix.arch }})
        env:
          SPARK_MACOS_ARCH: ${{ matrix.spark_arch }}
        run: |
          bun run build
          mkdir -p dist/skillet/macos
          rm -rf dist/skillet/macos/Skillet.app
          cp -R ".spark/products/macos-${{ matrix.spark_arch }}/release/Skillet.app" "dist/skillet/macos/Skillet.app"
          VERSION="$(node -p "require('./desktop.config.json').version")"
          ditto -c -k --sequesterRsrc --keepParent "dist/skillet/macos/Skillet.app" "dist/skillet/macos/Skillet-${VERSION}-${{ matrix.arch }}.zip"

      - name: Create DMG (${{ matrix.dmg }})
        run: |
          hdiutil create -volname "Skillet" -srcfolder "dist/skillet/macos/Skillet.app" -ov -format UDZO "dist/skillet/macos/${{ matrix.dmg }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Skillet-macOS-${{ matrix.arch }}
          path: |
            dist/skillet/macos/${{ matrix.dmg }}
            dist/skillet/macos/Skillet-*-${{ matrix.arch }}.zip

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            dist/skillet/macos/${{ matrix.dmg }}
            dist/skillet/macos/Skillet-*-${{ matrix.arch }}.zip
