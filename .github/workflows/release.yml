name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            target: Apple Silicon (arm64)
            dmg: Skillet-macOS-arm64.dmg
          - arch: x86
            target: Intel (x64)
            dmg: Skillet-macOS-x64.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Restore enriched-markdown native assets
        run: node node_modules/react-native-enriched-markdown/postinstall.mjs

      - name: Run verification (typecheck & tests)
        run: |
          bun run typecheck
          bun run test

      - name: Package macOS App (${{ matrix.arch }})
        run: |
          bun scripts/package-macos-app.ts skillet ${{ matrix.arch }} --skip-sign --skip-notarize --skip-appcast

      - name: Create DMG (${{ matrix.dmg }})
        run: |
          hdiutil create -volname "Skillet" -srcfolder "dist/skillet/macos/Skillet.app" -ov -format UDZO "dist/skillet/macos/${{ matrix.dmg }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Skillet-macOS-${{ matrix.arch }}
          path: |
            dist/skillet/macos/${{ matrix.dmg }}
            dist/skillet/macos/Skillet-*-${{ matrix.arch }}.zip

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            dist/skillet/macos/${{ matrix.dmg }}
            dist/skillet/macos/Skillet-*-${{ matrix.arch }}.zip
