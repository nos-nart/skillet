name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            output: Skillet-macOS-x64.dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            output: Skillet-macOS-arm64.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            output: Skillet-Windows-x64.msi
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            output: Skillet-Linux-x64.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build Web Assets
        run: deno task build

      - name: Package Desktop App
        run: deno desktop --icon public/icon.png -A --target ${{ matrix.target }} -o ${{ matrix.output }} desktop.ts

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.output }}
